spring:
  application:
    name: hbeutc-campus-guide
  profiles:
    default: demo
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  flyway:
    enabled: true
    locations: classpath:db/migration/default
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# OpenAPI / Knife4j UI. Set KNIFE4J_ENABLED=false in production.
springdoc:
  api-docs:
    enabled: ${KNIFE4J_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${KNIFE4J_ENABLED:true}
    path: /swagger-ui.html

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

app:
  jwt:
    secret: ${APP_JWT_SECRET:demo-only-change-this-jwt-secret-32-chars-minimum}
    ttl-minutes: ${APP_JWT_TTL_MINUTES:480}
  storage:
    upload-dir: ${APP_UPLOAD_DIR:./data/uploads}
    max-file-bytes: ${APP_MAX_FILE_BYTES:52428800}
  cors:
    allowed-origins:
      - ${APP_CORS_ORIGIN:http://localhost:5173}
      - ${APP_CORS_ORIGIN_ALT:http://127.0.0.1:5173}
  speech:
    max-seconds: 30
  rag:
    chunk-size: 420
    overlap: 70
    min-score: 0.16
    top-k: 5
  ai:
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    chat-model: ${AI_CHAT_MODEL:gpt-4.1-mini}
    transcription-model: ${AI_ASR_MODEL:whisper-1}
    speech-model: ${AI_TTS_MODEL:gpt-4o-mini-tts}
    speech-voice: ${AI_TTS_VOICE:alloy}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:45}

---
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: jdbc:h2:file:./data/campus-guide;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/campus_guide?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
  h2:
    console:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:${PG_PORT:55432}/campus_guide}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:123456}
  flyway:
    locations: classpath:db/migration/postgresql
  h2:
    console:
      enabled: false

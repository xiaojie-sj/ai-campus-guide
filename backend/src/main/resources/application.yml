spring:
  application:
    name: campus-guide
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:${PG_PORT:55432}/${PG_DB:campus_guide}}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:123456}
    hikari:
      pool-name: campus-guide-pool
      maximum-pool-size: ${PG_POOL_MAX:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# OpenAPI / Knife4j UI. Set KNIFE4J_ENABLED=false in production.
springdoc:
  api-docs:
    enabled: ${KNIFE4J_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${KNIFE4J_ENABLED:true}
    path: /swagger-ui.html

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  links:
    # Hint printed at startup; point it at the real domain in production.
    frontend: ${APP_FRONTEND_URL:http://127.0.0.1:5173}
  seed:
    # Idempotent bootstrap of demo accounts and the bundled knowledge set.
    demo-data: ${APP_SEED_DEMO_DATA:true}
  security:
    # Set APP_DEMO_MODE=false in production: this disables demo seeding and
    # rejects the shipped demo JWT secret.
    demo-mode: ${APP_DEMO_MODE:true}
    login-max-attempts: ${APP_LOGIN_MAX_ATTEMPTS:5}
    login-window-minutes: ${APP_LOGIN_WINDOW_MINUTES:15}
    login-lock-minutes: ${APP_LOGIN_LOCK_MINUTES:15}
    public-requests-per-minute: ${APP_PUBLIC_RPM:60}
    ai-requests-per-minute: ${APP_AI_RPM:10}
  jwt:
    secret: ${APP_JWT_SECRET:demo-only-change-this-jwt-secret-32-chars-minimum}
    ttl-minutes: ${APP_JWT_TTL_MINUTES:480}
    issuer: ${APP_JWT_ISSUER:campus-guide}
    audience: ${APP_JWT_AUDIENCE:campus-guide-admin}
    cookie-name: ${APP_JWT_COOKIE_NAME:cg_admin_session}
    cookie-secure: ${APP_COOKIE_SECURE:false}
    cookie-same-site: ${APP_COOKIE_SAME_SITE:Strict}
  storage:
    upload-dir: ${APP_UPLOAD_DIR:./data/uploads}
    max-file-bytes: ${APP_MAX_FILE_BYTES:52428800}
  cors:
    allowed-origins:
      - ${APP_CORS_ORIGIN:http://localhost:5173}
      - ${APP_CORS_ORIGIN_ALT:http://127.0.0.1:5173}
  speech:
    max-seconds: 30
  rag:
    chunk-size: 420
    overlap: 70
    min-score: 0.16
    top-k: 5
  ai:
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    chat-model: ${AI_CHAT_MODEL:gpt-4.1-mini}
    transcription-model: ${AI_ASR_MODEL:whisper-1}
    speech-model: ${AI_TTS_MODEL:gpt-4o-mini-tts}
    speech-voice: ${AI_TTS_VOICE:alloy}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:45}

